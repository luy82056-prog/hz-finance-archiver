name: 银行流水
document_type: 银行流水
min_score: 0.2
keywords:
  - 银行
  - 交易
  - 余额
  - 对方户名
  - 流水
fields:
  party:
    - "对方户名[:：\\s]*([^\\n]+)"
    - "收款人[:：\\s]*([^\\n]+)"
    - "付款人[:：\\s]*([^\\n]+)"
  date:
    - "(\\d{4}[./-]\\d{1,2}[./-]\\d{1,2})"
    - "(\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"
  document_number:
    - "流水号[:：\\s]*([A-Z0-9\\-]{6,})"
    - "交易编号[:：\\s]*([A-Z0-9\\-]{6,})"
  amount:
    - "交易金额[:：\\s¥￥]*([+-]?[\\d,]+\\.\\d{2})"
    - "金额[:：\\s¥￥]*([+-]?[\\d,]+\\.\\d{2})"
  project:
    - "摘要[:：\\s]*([^\\n]+)"
