name: 增值税发票
document_type: 发票
min_score: 0.15
keywords:
  - 发票
  - 税额
  - 价税合计
  - 购买方
  - 销售方
fields:
  party:
    - "销\\s*名称[:：\\s]*([^\\n]+)"
    - "销售方[^\\n]{0,30}?名称[:：\\s]*([^\\n]+)"
    - "销售方名称[:：\\s]*([^\\n]+)"
    - "销\\s*售\\s*方[\\s\\S]{0,80}?名称[:：\\s]*([^\\n]+)"
    - "收款单位[:：\\s]*([^\\n]+)"
  date:
    - "(\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"
    - "(\\d{4}[./-]\\d{1,2}[./-]\\d{1,2})"
  document_number:
    - "发票号码[:：\\s]*([A-Z0-9\\-]{6,})"
    - "号码[:：\\s]*([A-Z0-9\\-]{6,})"
  amount:
    - "价税合计[^\\d¥￥-]*[¥￥]?\\s*([\\d,]+\\.\\d{2})"
    - "合计金额[^\\d¥￥-]*[¥￥]?\\s*([\\d,]+\\.\\d{2})"
  tax_amount:
    - "合\\s*计\\s*[¥￥]?(?:[\\d,]+\\.\\d{2})\\s*[¥￥]?([\\d,]+\\.\\d{2})"
    - "合计税额[^\\d¥￥-]*[¥￥]?\\s*([\\d,]+\\.\\d{2})"
    - "税额[^\\d¥￥-]*[¥￥]?\\s*([\\d,]+\\.\\d{2})"
  tax_rate:
    - "税率/征收率\\s*税\\s*额[\\s\\S]{0,120}?(\\d+(?:\\.\\d+)?%)"
    - "\\b(\\d+(?:\\.\\d+)?%)\\s+[\\d,]+\\.\\d{2}"
  project:
    - "项目名称\\s+规格型号\\s+单\\s*位\\s+数\\s*量\\s+单\\s*价\\s+金\\s*额\\s+税率/征收率\\s+税\\s*额\\s*\\n([\\s\\S]+?)\\n\\s*合\\s*计"
    - "项目名称[:：\\s]*([^\\n]+)"
