name: 报销单
document_type: 报销单
min_score: 0.2
keywords:
  - 报销
  - 费用
  - 部门
  - 申请人
fields:
  party:
    - "申请人[:：\\s]*([^\\n]+)"
    - "报销人[:：\\s]*([^\\n]+)"
  date:
    - "日期[:：\\s]*(\\d{4}[./-]\\d{1,2}[./-]\\d{1,2})"
    - "(\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"
  document_number:
    - "单据编号[:：\\s]*([A-Z0-9\\-]{4,})"
  amount:
    - "报销金额[:：\\s¥￥]*([\\d,]+\\.\\d{2})"
    - "合计[:：\\s¥￥]*([\\d,]+\\.\\d{2})"
  project:
    - "项目[:：\\s]*([^\\n]+)"
