name: 付款回单
document_type: 付款回单
min_score: 0.2
keywords:
  - 回单
  - 付款
  - 收款
  - 交易
fields:
  party:
    - "收款人名称[:：\\s]*([^\\n]+)"
    - "收款方[:：\\s]*([^\\n]+)"
    - "收款户名[:：\\s]*([^\\n]+)"
  date:
    - "交易日期[:：\\s]*(\\d{4}[./-]\\d{1,2}[./-]\\d{1,2})"
    - "(\\d{4}\\s*年\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日)"
  document_number:
    - "回单编号[:：\\s]*([A-Z0-9\\-]{6,})"
    - "交易流水号[:：\\s]*([A-Z0-9\\-]{6,})"
  amount:
    - "付款金额[:：\\s¥￥]*([\\d,]+\\.\\d{2})"
    - "金额[:：\\s¥￥]*([\\d,]+\\.\\d{2})"
  project:
    - "用途[:：\\s]*([^\\n]+)"
